name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stress:
        description: Run the opt-in 1 GiB streaming stress tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"

jobs:
  check:
    name: Checks and Worker bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.11.0 <25"
          cache: npm
      - run: npm ci
      - name: Check the generated vendored WASM is reproducible
        run: git diff --exit-code -- src/vendor/xz-decompress.wasm
      - run: npm run check
      - name: Bundle the Worker without deploying or authenticating
        run: npx wrangler deploy --dry-run --outdir dist/ci

  browser:
    name: Chromium OAuth regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.11.0 <25"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install playwright==1.61.0
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the native login form with isolated temporary credentials
        run: python scripts/ci-oauth-browser.py

  stress:
    name: 1 GiB streaming stress (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stress }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.11.0 <25"
          cache: npm
      - run: npm ci
      - name: Run the opt-in bounded-streaming suite
        env:
          RUN_STREAMR_STRESS: "1"
        run: npx vitest run --config test/stress/vitest.config.ts test/stress/bounded-streaming.test.ts
